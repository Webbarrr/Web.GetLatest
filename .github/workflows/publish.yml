name: Publish ghver to NuGet

on:
  release:
    types: [created]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal -p:TestingPlatformDotnetTestSupport=true

  pack-and-publish:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: ver
        shell: bash
        run: |
          # Get tag name (refs/tags/v1.2.3)
          tag=${GITHUB_REF#refs/tags/}
          # Strip leading 'v' if present
          version=${tag#v}
          echo "tag=$tag"
          echo "version=$version"
          echo "::set-output name=version::$version"

      - name: Pack
        run: |
          mkdir -p artifacts
          dotnet pack src/Web.GetLatest.Cli --configuration Release -o ./artifacts /p:PackageVersion=${{ steps.ver.outputs.version }} --no-build

      - name: NuGet login (OIDC → temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          # Recommended: set the NuGet username (profile name) in repo secrets
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: |
          dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghver-packages
          path: ./artifacts
